name: Compilar APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar APK (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Compilar APK (release)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: ExtractorGramatical-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir APK release
        uses: actions/upload-artifact@v4
        with:
          name: ExtractorGramatical-release
          path: app/build/outputs/apk/release/*.apk
